name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --force --prune --tags origin \
              "+refs/heads/*:refs/remotes/origin/*" \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge"
            git checkout --force "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --force --prune --tags origin \
              "+refs/heads/*:refs/remotes/origin/*"
            git checkout --force "$GITHUB_SHA"
          fi

          git config --local --unset-all http.https://github.com/.extraheader

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          download_url="${release_url}/${archive}"
          checksum_url="${release_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          echo "Gitleaks version: ${GITLEAKS_VERSION}"
          echo "Download URL: ${download_url}"
          echo "Checksums URL: ${checksum_url}"
          curl -sSfL "$download_url" -o "/tmp/${archive}"
          curl -sSfL "$checksum_url" -o /tmp/gitleaks_checksums.txt
          (cd /tmp && grep "  ${archive}$" gitleaks_checksums.txt | sha256sum -c -)

          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan current tracked files
        shell: bash
        run: |
          set -uo pipefail

          snapshot_dir="$(mktemp -d)"
          report_path="$(mktemp)"
          trap 'rm -rf "$snapshot_dir"; rm -f "$report_path"' EXIT

          while IFS= read -r -d '' file_path; do
            if [ -f "$file_path" ]; then
              mkdir -p "$snapshot_dir/$(dirname "$file_path")"
              cp -- "$file_path" "$snapshot_dir/$file_path"
            fi
          done < <(git ls-files -z)

          set +e
          gitleaks dir "$snapshot_dir" \
            --config .gitleaks.toml \
            --redact=100 \
            --exit-code 1 \
            --log-level warn \
            --report-format json \
            --report-path "$report_path" \
            >/dev/null 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "No current tracked-file leaks detected."
            exit 0
          fi

          if [ "$status" -eq 1 ]; then
            if [ -s "$report_path" ]; then
              echo "::group::Current tracked-file Gitleaks findings (redacted metadata only)"
              python3 - "$report_path" "$snapshot_dir" <<'PY'
          import json
          import os
          import sys

          def escape_data(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def escape_property(value):
              return escape_data(value).replace(":", "%3A").replace(",", "%2C")

          report_path = sys.argv[1]
          snapshot_dir = os.path.abspath(sys.argv[2])

          with open(report_path, "r", encoding="utf-8") as handle:
              findings = json.load(handle)

          if not isinstance(findings, list):
              findings = []

          print(f"Detected {len(findings)} current tracked-file finding(s).")
          for finding in findings:
              rule_id = finding.get("RuleID", "unknown-rule")
              file_path = os.path.abspath(finding.get("File", ""))
              if file_path.startswith(snapshot_dir + os.sep):
                  file_path = file_path[len(snapshot_dir) + 1 :]
              file_path = file_path.replace(os.sep, "/")
              start_line = finding.get("StartLine") or 1
              fingerprint = finding.get("Fingerprint", "")
              description = finding.get("Description", "")
              title = f"Gitleaks current {rule_id}"
              message = f"{rule_id}: {description} Fingerprint: {fingerprint}"
              print(
                  f"::error file={escape_property(file_path)},"
                  f"line={start_line},"
                  f"title={escape_property(title)}::{escape_data(message)}"
              )
          PY
              echo "::endgroup::"
            else
              echo "::warning::Gitleaks reported current tracked-file secrets, but no JSON report was generated."
            fi
            echo "::error::Gitleaks detected secrets in current tracked files. Rotate or revoke any real secret before removing it from code or history."
            exit 1
          fi

          echo "::error::Gitleaks current tracked-file scan failed unexpectedly with exit code ${status}."
          exit "$status"

      - name: Scan committed history
        shell: bash
        run: |
          set -uo pipefail

          report_path="$(mktemp)"
          trap 'rm -f "$report_path"' EXIT

          set +e
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact=100 \
            --exit-code 1 \
            --log-level warn \
            --report-format json \
            --report-path "$report_path" \
            >/dev/null 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "No committed-history leaks detected."
            exit 0
          fi

          if [ "$status" -eq 1 ]; then
            if [ -s "$report_path" ]; then
              echo "::group::Committed-history Gitleaks findings (redacted metadata only)"
              python3 - "$report_path" <<'PY'
          import json
          import sys

          def escape_data(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def escape_property(value):
              return escape_data(value).replace(":", "%3A").replace(",", "%2C")

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              findings = json.load(handle)

          if not isinstance(findings, list):
              findings = []

          print(f"Detected {len(findings)} committed-history finding(s).")
          for finding in findings:
              rule_id = finding.get("RuleID", "unknown-rule")
              file_path = finding.get("File", "")
              start_line = finding.get("StartLine") or 1
              fingerprint = finding.get("Fingerprint", "")
              description = finding.get("Description", "")
              title = f"Gitleaks history {rule_id}"
              message = f"{rule_id}: {description} Fingerprint: {fingerprint}"
              print(
                  f"::error file={escape_property(file_path)},"
                  f"line={start_line},"
                  f"title={escape_property(title)}::{escape_data(message)}"
              )
          PY
              echo "::endgroup::"
            else
              echo "::warning::Gitleaks reported committed-history secrets, but no JSON report was generated."
            fi
            echo "::error::Gitleaks detected secrets in committed history. Rotate or revoke any real secret before removing it from code or history."
            exit 1
          fi

          echo "::error::Gitleaks committed-history scan failed unexpectedly with exit code ${status}."
          exit "$status"
